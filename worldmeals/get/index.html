<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get WorldMeals</title>
<script>
  (function () {
    var ios = "https://apps.apple.com/app/worldmeals/id6797013060";
    var android = "https://play.google.com/store/apps/details?id=app.worldmeals.android";
    var ua = navigator.userAgent || "";
    var isAndroid = /android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
      (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    if (isAndroid) window.location.replace(android);
    else if (isIOS) window.location.replace(ios);
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, sans-serif; background: #F6EFE3; color: #1F2A1F; text-align: center; }
  h1 { font-size: 28px; margin: 0 0 24px; }
  a { display: block; margin: 12px auto; padding: 14px 24px; max-width: 260px; border-radius: 12px;
      background: #1F2A1F; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <h1>Get WorldMeals</h1>
    <a href="https://apps.apple.com/app/worldmeals/id6797013060">Download on the App Store</a>
    <a href="https://play.google.com/store/apps/details?id=app.worldmeals.android">Get it on Google Play</a>
  </main>
</body>
</html>
